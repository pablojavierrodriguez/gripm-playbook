name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.2.2)'
        required: false
        default: ''

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Verify and publish @gripm/playbook to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve the version to publish
        id: version
        run: |
          set -euo pipefail
          INPUT_TAG="${{ github.event.inputs.tag }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$PKG_VERSION"
          fi

          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::Tag $TAG no coincide con package.json ($PKG_VERSION)."
            exit 1
          fi

          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify the tag is not already published
        id: already
        run: |
          set -euo pipefail
          if npm view "@gripm/playbook@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@gripm/playbook@${{ steps.version.outputs.version }} ya está publicado en npm."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate repository consistency
        run: npm run validate

      - name: Rule engine tests
        run: npm test

      - name: Package sanity check
        run: npm pack --dry-run

      - name: Publish to npm with provenance
        if: steps.already.outputs.already_published != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report already-published version
        if: steps.already.outputs.already_published == 'true'
        run: |
          echo "✅ @gripm/playbook@${{ steps.version.outputs.version }} ya estaba publicado en npm."
          echo "   Se omite la publicación repetida."

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✅ GitHub Release $TAG ya existe. Omitiendo creación duplicada."
          else
            echo "📦 Extrayendo notas de la release desde CHANGELOG.md..."
            node -e "
              const fs = require('fs');
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
              const lines = changelog.split(/\r?\n/);
              let capturing = false;
              const section = [];
              for (const line of lines) {
                if (line.startsWith('## [' + '$VERSION' + ']')) {
                  capturing = true;
                  continue;
                }
                if (capturing && line.startsWith('## [')) {
                  break;
                }
                if (capturing) {
                  section.push(line);
                }
              }
              const notes = section.join('\n').replace(/^---\s*$/m, '').trim();
              fs.writeFileSync('release-notes.txt', (notes || ('Release ' + '$TAG')) + '\n');
            "

            TITLE="Release $TAG"
            echo "🚀 Creando GitHub Release $TAG: $TITLE"
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file release-notes.txt
            echo "✅ GitHub Release $TAG creada exitosamente."
          fi
